name: Collect and publish

on:
  # Daily. Cron is UTC, and an off-the-hour minute avoids the queueing delay
  # GitHub applies to runs scheduled exactly on the hour.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shares the `pages` group with deploy.yml: only one deployment at a time, and
# a queued run is never cancelled halfway through committing data.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Never collect on the template repository itself — it has no library to
    # collect, so a daily run there is a daily red X on a page people are
    # meant to be reassured by.
    #
    # Copies made with "Use this template" get a different `github.repository`
    # and so start collecting with nothing to edit. (They are not forks, so
    # GitHub's own rule about disabling schedules in forks does not cover this.)
    #
    # The second clause is belt to that braces: if a copy is itself marked as a
    # template it stays quiet too. `github.event.repository` may be absent on a
    # schedule payload, in which case the term is simply null and the first
    # clause still decides — it can only ever add a reason to skip.
    if: >-
      github.repository != 'IanSkelskey/game-feed' &&
      github.event.repository.is_template != true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Collect
        # SITE_BASE is derived from GITHUB_REPOSITORY inside collector/config.ts,
        # so image URLs point at this repository's own Pages site with nothing
        # to configure. Every secret is optional on its own: a source whose
        # variables are unset is skipped, and the run fails only if none are.
        run: npm run collect
        env:
          RETRO_ACHIEVEMENTS_USERNAME: ${{ secrets.RETRO_ACHIEVEMENTS_USERNAME }}
          RETRO_ACHIEVEMENTS_API_KEY: ${{ secrets.RETRO_ACHIEVEMENTS_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_GRID_DB_API_KEY: ${{ secrets.STEAM_GRID_DB_API_KEY }}

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A rather than naming data/ and images/: on the very first run one
          # of them may not exist yet, and git add errors on a missing pathspec.
          # dist/ and node_modules/ are gitignored, so nothing else sneaks in.
          git add -A

          if git diff --cached --quiet; then
            echo "No change in collected data."
            exit 0
          fi

          git commit -m "data: collection for $(date -u +%Y-%m-%d)"

          # One immutable tag per update, so any past state of the data can be
          # fetched by date. Suffixed when a day has more than one run.
          base="data-$(date -u +%Y-%m-%d)"
          tag="$base"
          n=2
          git fetch --tags --quiet
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            tag="$base-$n"
            n=$((n + 1))
          done

          git tag -a "$tag" -m "Game stats as of $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
          echo "Committed and tagged $tag"

      # A project page is served from /<repo>/, a user page from the domain
      # root. Deriving it means neither has anything to hand-edit.
      - name: Resolve base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      # Builds from the working tree, which already holds this run's data and
      # images — committed or not.
      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
